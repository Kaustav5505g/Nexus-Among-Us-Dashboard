  return{c:[[hw*.86,-hh*.72,.7],[-hw*.88,hh*.78,.45],[hw*.9,hh*.8,.45],[-hw*.9,-hh*.8,.5],[hw*.55,hh*.88,.4],[-hw*.5,hh*.88,.4],[hw*.95,hh*.1,.45]],px:w?pw*.82:pw*.5,py:w?ph*.55:ph*.8,ps:w?.9:.6}};
 {const t=tg();S.c=t.c.map(x=>x.slice());S.px=t.px;S.py=t.py;S.ps=t.ps}

 addEventListener('resize',size);

try{scene3d=init3d()}catch(e){scene3d=null}
const warpTo3=v=>{if(scene3d&&!RM)scene3d.S.warpT=v};

/* ===== cover: swipe up ===== */
const cover=$('#cover'),login=$('#login');let sy=null,prog=0,opened=false,moved=false;
function setP(p){prog=Math.max(0,Math.min(1,p));cover.style.setProperty('--p',prog);login.style.setProperty('--lo',prog);warpTo3(prog*.8)}
cover.onpointerdown=e=>{if(opened||e.target.closest('#hint'))return;sy=e.clientY;moved=false;cover.classList.remove('rel');cover.setPointerCapture(e.pointerId);login.classList.add('on');cover.style.cursor='grabbing'};
cover.onpointermove=e=>{if(sy==null)return;moved=true;setP((sy-e.clientY)/(innerHeight*.5))};
cover.onpointerup=cover.onpointercancel=()=>{if(sy==null)return;sy=null;cover.style.cursor='';cover.classList.add('rel');if(prog>.25)openLogin();else{setP(0);login.classList.remove('on')}};
function openLogin(){if(opened)return;opened=true;navigator.vibrate&&navigator.vibrate(30);mode='login';login.classList.add('on');cover.classList.add('rel');setP(1);warpTo3(1);setTimeout(()=>warpTo3(0),650);setTimeout(()=>{cover.classList.add('gone');$('#tid').focus({preventScroll:true})},850)}
function backToCover(){opened=false;mode='cover';cover.classList.remove('gone');void cover.offsetWidth;cover.classList.add('rel');setP(0);setTimeout(()=>{if(!opened)login.classList.remove('on')},800)}
$('#hint').onclick=openLogin;$('#back').onclick=backToCover;
addEventListener('wheel',e=>{if(!opened&&mode==='cover'&&e.deltaY>20)openLogin();else if(opened&&mode==='login'&&scrollY===0&&e.deltaY<-40)backToCover()},{passive:true});
addEventListener('keydown',e=>{if(!opened&&mode==='cover'&&['ArrowUp','ArrowDown','Enter',' '].includes(e.key)){e.preventDefault();openLogin()}});
if(!RM&&matchMedia('(hover:hover)').matches)addEventListener('pointermove',e=>{const t=$('#title');t.style.setProperty('--ty',((e.clientX/innerWidth-.5)*16)+'deg');t.style.setProperty('--tx',(-(e.clientY/innerHeight-.5)*12)+'deg')});

/* ===== login & database auth ===== */
const fr=$('#frame');
if(!RM&&matchMedia('(hover:hover)').matches){fr.onpointermove=e=>{const b=fr.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;fr.style.transform=`perspective(1000px) rotateY(${x*6}deg) rotateX(${-y*6}deg)`};fr.onpointerleave=()=>fr.style.transform=''}
$('#tid').oninput=e=>{e.target.removeAttribute('aria-invalid');$('#err').textContent=''};
$('#pname').oninput=e=>{e.target.removeAttribute('aria-invalid');$('#err').textContent=''};
function fail(msg,el){$('#err').textContent=msg;el.setAttribute('aria-invalid','true');el.focus();fr.classList.remove('shake');void fr.offsetWidth;fr.classList.add('shake')}
async function warpTo(steps,done){const w=$('#warp'),fl=$('#flash');w.classList.add('on');$('#pbi').style.width='0';warpTo3(1);await wait(RM?0:500);
 for(const [i,s] of steps.entries()){$('#stx').textContent=s;$('#pbi').style.width=((i+1)/steps.length*100)+'%';await wait(RM?80:650)}
 fl.style.opacity=1;await wait(RM?0:350);done();warpTo3(0);scrollTo(0,0);w.classList.remove('on');fl.style.opacity=0}

function getDatabaseTeams(){
 try{
  const raw=localStorage.getItem('nexus_teams_v2');
  if(raw){const p=JSON.parse(raw);if(Array.isArray(p)&&p.length>0)return p}
 }catch(e){}
 return[
  {id:'team-1',teamCode:'NX-T1',name:'Alpha Crew',assignedRoomId:'room-1',assignedRoomName:'Cafeteria',assignedZone:'Zone A',members:['Alice','Bob']},
  {id:'team-2',teamCode:'NX-T2',name:'Beta Impostors',assignedRoomId:'room-2',assignedRoomName:'MedBay',assignedZone:'Zone B',members:['Charlie','Dave']},
  {id:'team-3',teamCode:'NX-T3',name:'Gamma Detectives',assignedRoomId:'room-3',assignedRoomName:'Electrical',assignedZone:'Zone C',members:['Eve','Frank']},
  {id:'team-4',teamCode:'NX-T4',name:'Delta Voyagers',assignedRoomId:'room-4',assignedRoomName:'Navigation',assignedZone:'Zone D',members:['Grace','Heidi']},
  {id:'team-5',teamCode:'NX-T5',name:'Omega Saboteurs',assignedRoomId:'room-5',assignedRoomName:'Reactor',assignedZone:'Zone E',members:['Ivan','Judy']}
 ];
}

function getDatabaseRooms(){
 try{
  const raw=localStorage.getItem('nexus_rooms_v2');
  if(raw){const p=JSON.parse(raw);if(Array.isArray(p)&&p.length>0)return p}
 }catch(e){}
 return[
  {id:'room-1',name:'Cafeteria',zone:'Zone A',pocName:'Sarah Jenkins',pocContact:'+91 98765 43210'},
  {id:'room-2',name:'MedBay',zone:'Zone B',pocName:'Dr. Marcus Vance',pocContact:'+91 98765 43211'},
  {id:'room-3',name:'Electrical',zone:'Zone C',pocName:'Elena Rostova',pocContact:'+91 98765 43212'},
  {id:'room-4',name:'Navigation',zone:'Zone D',pocName:'Captain James Cole',pocContact:'+91 98765 43213'},
  {id:'room-5',name:'Reactor',zone:'Zone E',pocName:'Chief Engineer Chen',pocContact:'+91 98765 43214'}
 ];
}

$('#f').onsubmit=async e=>{
 e.preventDefault();
 const enteredId=$('#tid').value.trim();
 const enteredPlayer=$('#pname').value.trim();
 if(!enteredId)return fail('Enter your Team ID (e.g. NX-T1).',$('#tid'));

 const teams=getDatabaseTeams();
 const matchedTeam=teams.find(t=>
  (t.teamCode&&t.teamCode.toUpperCase()===enteredId.toUpperCase())||
  (t.id&&t.id.toLowerCase()===enteredId.toLowerCase())||
  (t.name&&t.name.toLowerCase()===enteredId.toLowerCase())
 );

 if(!matchedTeam){
  return fail('Invalid Team ID. Check with your event coordinator.', $('#tid'));
 }

 const rooms=getDatabaseRooms();
 const matchedRoom=rooms.find(r=>r.id===matchedTeam.assignedRoomId)||{
  name:matchedTeam.assignedRoomName||'Unassigned',
  zone:matchedTeam.assignedZone||'Pending',
  pocName:'Event Coordinator',
  pocContact:'Help Desk'
 };

 const session={
  team:matchedTeam,
  room:matchedRoom,
  playerName:enteredPlayer||'Crewmate',
  loggedInAt:new Date().toISOString()
 };

 localStorage.setItem('nexus_player_session',JSON.stringify(session));

 try{
  const rawLogs=localStorage.getItem('nexus_activity_logs_v2');
  const logs=rawLogs?JSON.parse(rawLogs):[];
  logs.unshift({
   id:'log-'+Date.now(),
   timestamp:new Date().toISOString(),
   type:'login',
   message:'Team '+matchedTeam.name+' ('+(matchedTeam.teamCode||matchedTeam.id)+') logged in. Role: '+(matchedTeam.isImpostor?'IMPOSTOR':'CREWMATE')+' in '+matchedRoom.name+'.',
   teamId:matchedTeam.teamCode||matchedTeam.id,
   teamName:matchedTeam.name,
   roomName:matchedRoom.name,
   severity:matchedTeam.isImpostor?'warning':'info'
  });
  localStorage.setItem('nexus_activity_logs_v2',JSON.stringify(logs.slice(0,500)));
 }catch(e){}

 $('#err').textContent='';

 const warpSteps=['Verifying Team ID…','Authenticating player clearance…',matchedTeam.isImpostor?'ALERT: IMPOSTOR ACCESS DETECTED…':'CREWMATE CLEARANCE CONFIRMED…','Entering player terminal…'];
 await warpTo(warpSteps,()=>{
  window.location.href='player.html';
 });
};
/* ===== lobby ===== */
const esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function draw(){$('#wCount').textContent=members.length+(members.length===1?' crewmate':' crewmates');
 $('#floor').innerHTML=members.length?members.map((m,i)=>{const c=pal[i%8];return `<div class="mem" style="--g:${c}" data-i="${i}"><button class="fl" aria-label="Wave: ${esc(m)}">${cm(c)}</button><span class="no">${i+1}</span><b>${esc(m)}</b><button class="x" aria-label="Remove ${esc(m)}">✕</button></div>`}).join(''):'<div class="empty">No crewmates yet. Add your first member above.</div>'}
$('#addf').onsubmit=e=>{e.preventDefault();const v=$('#mname').value.trim();if(!v)return;if(members.length>=10){$('#mname').placeholder='The ship is full (10 max)';$('#mname').value='';return}members.push(v);$('#mname').value='';draw()};
const fl=$('#floor');
fl.onclick=e=>{const m=e.target.closest('.mem');if(!m)return;if(e.target.closest('.x')){members.splice(+m.dataset.i,1);draw();return}m.classList.remove('hop');void m.offsetWidth;m.classList.add('hop')};
fl.onpointermove=e=>{const m=e.target.closest('.mem');if(!m||RM)return;const b=m.getBoundingClientRect();m.style.setProperty('--ry',((e.clientX-b.left)/b.width-.5)*20+'deg');m.style.setProperty('--rx',-((e.clientY-b.top)/b.height-.5)*20+'deg')};
fl.onmouseout=e=>{const m=e.target.closest('.mem');if(m&&!m.contains(e.relatedTarget)){m.style.setProperty('--rx','0deg');m.style.setProperty('--ry','0deg')}};
$('#leave').onclick=()=>warpTo(['Logging out…','Returning to the dock…'],()=>{members=[];mode='login';$('#lobby').classList.remove('on');login.classList.add('on')});
/* emergency */
let tm;function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='square';g.gain.value=.04;o.connect(g);g.connect(a.destination);[0,.25,.5,.75].forEach((d,i)=>o.frequency.setValueAtTime(i%2?520:760,t+d));o.start(t);o.stop(t+1)}catch(e){}}
function closeEm(){clearTimeout(tm);$('#em').classList.remove('on');if(scene3d)scene3d.S.alarm=0}
$('#emBtn').onclick=()=>{navigator.vibrate&&navigator.vibrate([200,100,200,100,200]);const em=$('#em');em.classList.remove('on');void em.offsetWidth;em.classList.add('on');beep();if(scene3d)scene3d.S.alarm=1;tm=setTimeout(closeEm,3600)};$('#em').onclick=closeEm;
</script>
