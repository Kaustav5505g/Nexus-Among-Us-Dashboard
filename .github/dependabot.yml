version: 2
updates:
  # Root dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
    assignees:
      - "Tejas-Narula"
      - "synthreaper"
    groups:
      root-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
    assignees:
      - "Tejas-Narula"
      - "synthreaper"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Freeze core framework major versions to preserve stability for TechIdeate'26
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
    assignees:
      - "Tejas-Narula"
      - "synthreaper"
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
