version: 2
updates:
  # Root dependencies - automated PR creation paused for event launch stability
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
    assignees:
      - "Tejas-Narula"
      - "synthreaper"

  # Frontend dependencies - automated PR creation paused for event launch stability
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
    assignees:
      - "Tejas-Narula"
      - "synthreaper"

  # Backend dependencies - automated PR creation paused for event launch stability
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
    assignees:
      - "Tejas-Narula"
      - "synthreaper"

  # GitHub Actions workflows - automated PR creation paused for event launch stability
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    reviewers:
      - "Tejas-Narula"
      - "synthreaper"
