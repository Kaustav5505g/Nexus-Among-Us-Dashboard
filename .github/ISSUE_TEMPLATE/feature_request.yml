name: Feature Request
description: Propose a new idea or feature for the NEXUS dashboard
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new game modes, UI improvements, or dashboard features!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, screenshots, or mockups.
    validations:
      required: false
