name: Bug Report
description: File a bug to help improve the NEXUS dashboard
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue!
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, etc.
      placeholder: e.g. Chrome 120, Windows 11, Node 20
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Go to '/arena'
        2. Click on 'Emergency Meeting'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
